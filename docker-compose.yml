version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: telegram-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: telegram_client
      MYSQL_USER: telegram
      MYSQL_PASSWORD: telegram123
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - telegram-network

  redis:
    image: redis:6.2
    container_name: telegram-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/data:/data
    command: redis-server --requirepass redis123
    networks:
      - telegram-network

networks:
  telegram-network:
    driver: bridge 